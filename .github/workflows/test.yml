name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:4.4
        ports:
          - 27017:27017

    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.0']
        gemfile: [gemfiles/rails_5.gemfile, gemfiles/rails_6.gemfile]
        exclude:
          - ruby: '3.0'
            gemfile: gemfiles/rails_5.gemfile

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - run: bundle install
      - run: bundle exec rake test
